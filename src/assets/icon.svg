<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c2e"/>
      <stop offset="1" stop-color="#151517"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E93FF"/>
      <stop offset="1" stop-color="#0A6FE0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0A84FF" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>

  <!-- focused terminal panel (left) -->
  <g filter="url(#soft)">
    <rect x="188" y="188" width="368" height="648" rx="60" fill="url(#blue)"/>
  </g>
  <polyline points="286,372 388,458 286,544" fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="320" y="590" width="150" height="40" rx="20" fill="rgba(255,255,255,0.92)"/>

  <!-- right stacked panels -->
  <rect x="596" y="188" width="240" height="304" rx="52" fill="#2f2f33" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <rect x="632" y="300" width="150" height="24" rx="12" fill="#5AC8FA"/>
  <rect x="632" y="344" width="104" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>

  <rect x="596" y="532" width="240" height="304" rx="52" fill="#2f2f33" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <rect x="632" y="640" width="120" height="24" rx="12" fill="#FF9F0A"/>
  <rect x="632" y="684" width="168" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
</svg>
